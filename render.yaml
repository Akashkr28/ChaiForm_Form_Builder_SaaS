databases:
  - name: chaiforms-postgres
    plan: free
    databaseName: chaiforms
    user: chaiforms

services:
  - type: web
    name: chaiforms-api
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm --filter @repo/api build
    startCommand: corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm --filter @repo/api start
    envVars:
      - key: NODE_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: chaiforms-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://chaiforms-api.onrender.com
      - key: WEB_URL
        value: https://chaiforms-web.onrender.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://chaiforms-api.onrender.com/auth/google/callback

  - type: web
    name: chaiforms-web
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm --filter web start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chaiforms-api.onrender.com/trpc
