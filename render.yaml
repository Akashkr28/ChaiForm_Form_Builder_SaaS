databases:
  - name: chaiforms-postgres
    plan: free
    databaseName: chaiforms
    user: chaiforms

services:
  - type: web
    name: chaiforms-api
    runtime: node
    plan: free
    buildCommand: corepack pnpm@9.0.0 install --frozen-lockfile && corepack pnpm@9.0.0 db:migrate && corepack pnpm@9.0.0 --filter @repo/api build
    startCommand: corepack pnpm@9.0.0 --filter @repo/api start
    envVars:
      - key: NODE_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: chaiforms-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://chaiforms-api-9s4m.onrender.com
      - key: WEB_URL
        value: https://chaiforms-web-hjco.onrender.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://chaiforms-api-9s4m.onrender.com/auth/google/callback

  - type: web
    name: chaiforms-web
    runtime: node
    plan: free
    buildCommand: corepack pnpm@9.0.0 install --frozen-lockfile && corepack pnpm@9.0.0 --filter web build
    startCommand: corepack pnpm@9.0.0 --filter web start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chaiforms-api-9s4m.onrender.com/trpc
